<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Cafe Finder</title>

  <!-- LEAFLET -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="css/style.css">

  <!-- GOOGLE FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

</head>

<body>

  <!-- LOADER -->

  <div id="loader">

    <div class="coffee-loader"></div>

    <p>Finding aesthetic cafes...</p>

  </div>

  <!-- NAVBAR -->

  <nav>

    <h1>

      <img
        src="assets/icons/coffee.png"
        width="30">

      Cafe Finder

    </h1>

    <div class="nav-buttons">

      <button id="darkBtn">

        🌙

      </button>

      <a href="favorites.html">

        ❤️ Favorites

      </a>

    </div>

  </nav>

  <!-- HERO -->

  <section class="hero">

    <h2>

      Discover Aesthetic Cafes Near You

    </h2>

    <p>

      Coffee • Reviews • Weather • Cozy Places

    </p>

  </section>

  <!-- SEARCH -->

  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="Search city or cafe">

    <button onclick="searchLocation()">

      Find Cafes

    </button>

  </div>

  <!-- AI BOX -->

  <div class="ai-box">

    <h3>

      🤖 AI Aesthetic Picks

    </h3>

    <p id="aiText">

      Searching best aesthetic cafes...

    </p>

  </div>

  <!-- WEATHER -->

  <div class="weather-box">

    <h3>

      🌤 Weather

    </h3>

    <p id="weatherText">

      Loading weather...

    </p>

  </div>

  <!-- MAP -->

  <div id="map"></div>

  <!-- FLOATING BUTTON -->

  <button id="topBtn">

    ⬆

  </button>

  <!-- FOOTER -->

  <footer>

    Made with ❤️ by Sukanya Beuria

  </footer>

  <!-- LEAFLET -->

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- JS -->

  <script src="js/script.js"></script>

</body>

</html>
